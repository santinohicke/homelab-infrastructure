services:
  # ============================================================================
  # 1. NGINX PROXY MANAGER (Reverse Proxy, SSL Automation & HTTP Routing)
  # ============================================================================
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'     # HTTP Routing & Certbot ACME Challenges
      - '443:443'   # HTTPS Edge Ingress (TLS 1.3)
      - '81:81'     # Web Admin Console
    environment:
      DB_SQLITE_FILE: '/data/database.sqlite'
      DISABLE_IPV6: '${DISABLE_IPV6:-true}'
    volumes:
      - ${DATA_ROOT}/npm/data:/data
      - ${DATA_ROOT}/npm/letsencrypt:/etc/letsencrypt
    networks:
      - homelab-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 2. UPTIME KUMA (Infrastructure & SLA Monitoring Platform)
  # ============================================================================
  uptime-kuma:
    image: 'louislam/uptime-kuma:2'
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - '3001:3001'
    volumes:
      - ${DATA_ROOT}/uptime-kuma:/app/data
    networks:
      - homelab-net
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 3. VAULTWARDEN (Zero-Knowledge AES-256 Password Vault)
  # ============================================================================
  vaultwarden:
    image: 'vaultwarden/server:latest'
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - '8085:80'
    environment:
      - WEBSOCKET_ENABLED=${VAULTWARDEN_WEBSOCKET_ENABLED:-true}
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      - ROCKET_PORT=80
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
    volumes:
      - ${DATA_ROOT}/vaultwarden:/data
    networks:
      - homelab-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 4. HOME ASSISTANT (Residential IoT & Home Automation Core)
  # ============================================================================
  homeassistant:
    image: 'ghcr.io/home-assistant/home-assistant:stable'
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ${DATA_ROOT}/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ============================================================================
  # 5. PORTAINER COMMUNITY EDITION (Docker Engine GUI Management)
  # ============================================================================
  portainer:
    image: 'portainer/portainer-ce:latest'
    container_name: portainer
    restart: unless-stopped
    ports:
      - '9443:9443'
      - '8000:8000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT}/portainer:/data
    networks:
      - homelab-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 6. FAIL2BAN (Intrusion Prevention & Brute-Force SSH/HTTP Defense)
  # ============================================================================
  fail2ban:
    image: 'crazymax/fail2ban:latest'
    container_name: fail2ban
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
      - F2B_LOG_LEVEL=INFO
      - F2B_DB_PURGE_AGE=1d
    volumes:
      - ${DATA_ROOT}/fail2ban/data:/data
      - ./config/fail2ban/jail.local:/etc/fail2ban/jail.local:ro
      - /var/log/auth.log:/var/log/auth.log:ro
      - ${DATA_ROOT}/npm/data/logs:/var/log/npm:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 7. HOMELAB DASHBOARD (Custom React Glassmorphism Dashboard UI)
  # ============================================================================
  dashboard:
    image: 'nginx:alpine'
    container_name: homelab-dashboard
    restart: unless-stopped
    ports:
      - '3000:80'
    volumes:
      - ${DATA_ROOT}/dashboard/dist:/usr/share/nginx/html:ro
      - ./config/nginx/dashboard.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - homelab-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  homelab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
